<!doctype html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Daily Study Routine</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#172740;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px}.brand{font-size:12px;letter-spacing:3px;font-weight:bold;color:#52718f}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;margin:25px 0}h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px;letter-spacing:-1.5px}p{line-height:1.6;color:#63738b;margin:8px 0}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,textarea{font:inherit}button{border:1px solid #d2dce9;border-radius:9px;background:white;padding:11px 16px;cursor:pointer;color:#263c59}button:hover{background:#edf3fc}input[type=date]{padding:10px;border:1px solid #d2dce9;border-radius:9px}.summary{background:#142a48;color:white;padding:24px;border-radius:16px;margin:25px 0}.summary p{color:#bdcee5}.summary-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:8px;border-radius:10px;background:#304967;margin-top:18px;overflow:hidden}.fill{height:100%;background:#69d5b5;width:0;transition:width .2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #e0e6ef;border-radius:16px;padding:24px;box-shadow:0 7px 22px #22334a05;border-top:4px solid var(--accent)}.card-head{display:flex;align-items:center;gap:12px}.number{background:var(--soft);color:var(--accent);border-radius:10px;padding:10px;font-weight:bold}h2{font-size:22px;margin:0}.count{margin-left:auto;color:#77869a;font-size:13px}.time{margin:18px 0;font-size:12px;color:#64748b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.time input{border:1px solid #e0e6ef;padding:6px;border-radius:6px;color:#334155;max-width:140px}.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #edf0f5;font-size:14px;line-height:1.5;cursor:pointer}.task input{width:18px;height:18px;margin:1px 0;accent-color:var(--accent);flex-shrink:0}.task:has(input:checked) span{text-decoration:line-through;color:#8996a8}.notes{margin-top:22px;background:white;border:1px solid #e0e6ef;border-radius:16px;padding:24px}.notes h2{font-size:18px}textarea{width:100%;min-height:105px;border:1px solid #dce4ee;border-radius:9px;padding:12px;resize:vertical;margin-top:12px}footer{font-size:12px;color:#75839a;margin-top:20px;line-height:1.7}.status{color:#166b51;font-size:12px} @media(max-width:650px){main{padding:25px 16px}.hero{display:block}.tools{margin-top:20px}.grid{grid-template-columns:1fr}.card{padding:20px}.summary-top{align-items:flex-start}}@media print{body{background:white}main{padding:0}.tools button,.status{display:none}.card,.summary,.notes{break-inside:avoid;box-shadow:none}.summary{color:#172740;background:#edf2f8}.summary p{color:#63738b}.grid{gap:12px}.card{padding:16px}.task{padding:8px 0}h1{font-size:32px}footer{font-size:10px}}
.task{align-items:center}.task label{display:flex;gap:12px;align-items:flex-start;flex:1;cursor:pointer}.repeat{padding:7px 9px;font-size:12px;white-space:nowrap}.repeat:disabled{opacity:.4;cursor:default}.times{font-size:12px;color:#61728c;margin-top:4px}.dashboard{margin:24px 0;background:white;padding:24px;border:1px solid #e0e6ef;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.stat{background:#f2f5fa;border-radius:10px;padding:16px}.stat strong{display:block;font-size:26px;color:#2563eb;margin-bottom:6px}.stat small{color:#64748b}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left;white-space:nowrap}th,td{padding:12px;border-bottom:1px solid #e5ebf2}th{color:#64748b}td button{padding:6px 9px;font-size:12px}@media(max-width:450px){.stats{grid-template-columns:1fr}.task{flex-wrap:wrap}.repeat{margin-left:30px}}@media print{.repeat,td button{display:none}.dashboard{break-inside:avoid}}h1{font-size:20px;letter-spacing:0;margin:0}.hero{margin:0 0 20px}main{padding-top:24px}@media print{h1{font-size:20px}}[hidden]{display:none!important}#auto-date{font-size:14px;color:#64748b}#show-completed{background:#142a48;color:white;border-color:#142a48}.day-record{border:1px solid #e0e6ef;border-radius:10px;margin:10px 0;background:white}.day-record summary{cursor:pointer;padding:13px 16px;font-size:14px;font-weight:600}.day-count{float:right;font-size:12px;font-weight:400;color:#64748b}.day-record ul{padding:0 20px 12px 36px;font-size:14px;line-height:1.6}.day-record[open] summary{border-bottom:1px solid #edf0f5;background:#f7f9fc}</style></head><body><main><header class="hero"><div><h1>দৈনিক IELTS অনুশীলনের রুটিন</h1></div><div class="tools"><span id="auto-date"></span><input id="date" type="hidden"><button id="show-completed">সম্পন্ন কাজ</button></div></header><div id="dashboard-view"><section class="summary"><div class="summary-top"><div><strong>Daily progress</strong><p id="done">0 of 17 activities completed</p></div><strong id="percent" style="font-size:32px">0%</strong></div><div class="bar" role="progressbar" aria-label="Daily completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div></section><section class="dashboard"><h2>Study dashboard</h2><p>দিনভিত্তিক অগ্রগতি ও পুনরায় অনুশীলনের হিসাব</p><div class="stats"><div class="stat"><strong id="days">0</strong><small>অনুশীলনের দিন</small></div><div class="stat"><strong id="sessions">0</strong><small>মোট অনুশীলন</small></div></div></section><div id="history" hidden></div><div class="grid" id="grid"></div></div><section id="completed-view" class="dashboard" hidden><div class="summary-top"><h2>সম্পন্ন কাজের ইতিহাস</h2><button id="back-dashboard">ড্যাশবোর্ডে ফিরুন</button></div><p>তারিখ অনুযায়ী আপনার টিক দেওয়া সম্পন্ন কাজ</p><div id="completed-list"></div></section><span id="status" hidden role="status"></span></main><script>
const sections=[{name:'Listening',color:'#2563eb',soft:'#eaf1ff',tasks:['Spelling','General listening','Words / paraphrase practice','1 listening test','Identify mistakes']},{name:'Reading',color:'#087f75',soft:'#e4f6f0',tasks:['1 Cambridge test and 5 small passages','Words / paraphrase practice','Sentence function','1 test','Identify mistakes']},{name:'Writing',color:'#b8750e',soft:'#fff4dc',tasks:['Idea generation','Words / paraphrase practice','Daily writing practice']},{name:'Speaking',color:'#7c4cc1',soft:'#f2ebff',tasks:['Watch 2 videos','Words / paraphrase practice','Sentence structure practice','Speaking test']}];
const writingTopics=['Line Graph','Bar Chart','Pie Chart','Table','Process Diagram','Map','Mixed Charts','Opinion Essay','Agree or Disagree Essay','Discussion Essay','Advantages and Disadvantages Essay','Advantages Outweigh Disadvantages Essay','Problem and Solution Essay','Cause and Effect Essay','Cause and Solution Essay','Double Question Essay','Two-Part Question Essay'];
const $=s=>document.querySelector(s);let data={},activeToday=true;const prefix='ielts-daily-routine-v1:';const firstDay='2026-10-08';const total=sections.reduce((n,s)=>n+s.tasks.length,0);
function today(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t).value;return `${get('year')}-${get('month')}-${get('day')}`}
$('#grid').innerHTML=sections.map((s,i)=>`<section class="card" style="--accent:${s.color};--soft:${s.soft}"><div class="card-head"><span class="number">0${i+1}</span><h2>${s.name}</h2><span class="count" id="count-${i}"></span></div>${s.tasks.map((t,j)=>`<div class="task"><label><input type="checkbox" data-task="${i}-${j}"><div><span>${t}</span></div></label></div>`).join('')}</section>`).join('');
$('#date').value=today();$('#auto-date').textContent=new Date().toLocaleDateString('bn-BD',{timeZone:'Asia/Dhaka',year:'numeric',month:'long',day:'numeric'});
const writingStart='2026-10-08';
function writingIndex(date){return Math.floor((Date.parse(date+'T00:00:00Z')-Date.parse(writingStart+'T00:00:00Z'))/86400000)}
function writingUpdate(){const day=writingIndex($('#date').value);const index=((day%17)+17)%17;const before=day<0;const type=index<7?'Task 1':'Task 2';const name=writingTopics[index];const label=document.querySelector('[data-task="2-2"]').parentElement.querySelector('span');label.textContent=before?'Daily writing practice (চক্র শুরুর আগে)':`${type}: ${name} — আজকের Writing practice`}
function key(){return prefix+$('#date').value}
function countFor(d,id){return d.tasks?.[id]?1:0}
function totals(d){let complete=0,sessions=0;sections.forEach((s,i)=>s.tasks.forEach((_,j)=>{const c=countFor(d,`${i}-${j}`);if(c){complete++;sessions+=c}}));return {complete,sessions,revisions:sessions-complete}}
function dashboard(){const records=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(prefix)&&/^\d{4}-\d{2}-\d{2}$/.test(k.slice(prefix.length))&&k.slice(prefix.length)>=firstDay){try{const d=JSON.parse(localStorage.getItem(k));if(d&&typeof d==='object')records.push({date:k.slice(prefix.length),...totals(d)})}catch{}}}}catch{}records.sort((a,b)=>b.date.localeCompare(a.date));$('#days').textContent=records.filter(r=>r.sessions>0).length;$('#sessions').textContent=records.reduce((a,r)=>a+r.sessions,0);$('#history').innerHTML=records.length?records.map(r=>`<tr><td>${r.date}</td><td>${r.complete}/${total}</td><td>${Math.round(r.complete/total*100)}%</td></tr>`).join(''):`<tr><td colspan="3">প্রথম টিক দেওয়ার পর আপনার হিসাব এখানে দেখা যাবে।</td></tr>`}
function update(){sections.forEach((s,i)=>{$(`#count-${i}`).textContent=`${s.tasks.filter((_,j)=>data.tasks?.[`${i}-${j}`]).length}/${s.tasks.length}`});const n=totals(data);const p=Math.round(n.complete/total*100);$('#done').textContent=`${n.complete} of ${total} activities completed`;$('#percent').textContent=p+'%';$('.fill').style.width=p+'%';$('.bar').setAttribute('aria-valuenow',p);dashboard();writingUpdate()}
function load(){try{data=JSON.parse(localStorage.getItem(key())||'{}');if(!data||typeof data!=='object')data={};$('#status').textContent='অটোসেভ চালু • '+$('#date').value}catch{data={};$('#status').textContent='অটোসেভ পাওয়া যাচ্ছে না। Print / PDF ব্যবহার করুন।'}data.tasks=data.tasks||{};data.times=data.times||{};data.counts=data.counts||{};document.querySelectorAll('[data-task]').forEach(el=>el.checked=!!data.tasks[el.dataset.task]);document.querySelectorAll('[data-time]').forEach(el=>el.value=data.times[el.dataset.time]||'');update()}
function completedView(){const entries=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(prefix)&&/^\d{4}-\d{2}-\d{2}$/.test(k.slice(prefix.length))&&k.slice(prefix.length)>=firstDay){try{const d=JSON.parse(localStorage.getItem(k));if(d&&totals(d).complete>0)entries.push({date:k.slice(prefix.length),data:d})}catch{}}}}catch{}entries.sort((a,b)=>b.date.localeCompare(a.date));$('#completed-list').innerHTML=entries.length?entries.map(e=>{const index=((writingIndex(e.date)%17)+17)%17;const lines=[];sections.forEach((s,i)=>s.tasks.forEach((t,j)=>{const c=countFor(e.data,`${i}-${j}`);if(c){const name=i===2&&j===2&&writingIndex(e.date)>=0?`${index<7?'Task 1':'Task 2'}: ${writingTopics[index]}`:t;lines.push(`<li style="margin:10px 0">${s.name} — ${name} <strong>✓ সম্পন্ন</strong></li>`)}}));return `<details class="day-record"><summary><span>${e.date}</span><span class="day-count">${lines.length}টি সম্পন্ন কাজ</span></summary><ul>${lines.join('')}</ul></details>`}).join(''):'<p>এখনও কোনো কাজ সম্পন্ন হয়নি। ড্যাশবোর্ডে কাজ শেষে টিক দিন।</p>'}
$('#show-completed').addEventListener('click',()=>{rollover();completedView();$('#dashboard-view').hidden=true;$('#completed-view').hidden=false;$('#show-completed').hidden=true});$('#back-dashboard').addEventListener('click',()=>{$('#date').value=today();activeToday=true;load();$('#dashboard-view').hidden=false;$('#completed-view').hidden=true;$('#show-completed').hidden=false});
function rollover(){if(activeToday&&$('#date').value!==today()){$('#date').value=today();$('#auto-date').textContent=new Date().toLocaleDateString('bn-BD',{timeZone:'Asia/Dhaka',year:'numeric',month:'long',day:'numeric'});load();if(!$('#completed-view').hidden)completedView();return true}return false}
function save(){data.times={};document.querySelectorAll('[data-time]').forEach(el=>data.times[el.dataset.time]=el.value);data.updatedAt=new Date().toISOString();try{localStorage.setItem(key(),JSON.stringify(data));$('#status').textContent='অটোসেভ হয়েছে • '+new Date().toLocaleTimeString('bn-BD',{timeZone:'Asia/Dhaka'})}catch{$('#status').textContent='সংরক্ষণ হয়নি। Print / PDF দিয়ে কপি রাখুন।'}update()}
$('#grid').addEventListener('change',e=>{const el=e.target;const checked=el.checked,value=el.value;rollover();if(el.dataset.task){const id=el.dataset.task;el.checked=checked;data.tasks[id]=checked;data.counts[id]=checked?Math.max(1,Number(data.counts[id])||1):0}else if(el.dataset.time){el.value=value}save()});
window.addEventListener('storage',e=>{if(e.key?.startsWith(prefix)){load();if(!$('#completed-view').hidden)completedView()}});window.addEventListener('focus',rollover);setInterval(rollover,1000);load();
</script></body></html>
